<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Naija Brain Battle</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #18b96d, transparent 35%),
        radial-gradient(circle at bottom right, #006b3c, transparent 40%),
        linear-gradient(135deg, #003b22, #008751);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      color: white;
    }

    .game-container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: rgba(255,255,255,0.97);
      color: #222;
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
      overflow: hidden;
    }

    /* START SCREEN */

    #start-screen {
      text-align: center;
    }

    .logo {
      font-size: 70px;
      margin-bottom: 5px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .title {
      font-size: 38px;
      font-weight: 900;
      color: #008751;
      margin: 5px 0;
    }

    .subtitle {
      color: #666;
      font-size: 18px;
    }

    .start-btn {
      background: linear-gradient(135deg, #00a859, #006b3c);
      color: white;
      border: none;
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
      box-shadow: 0 7px 0 #004d2b;
      transition: 0.15s;
    }

    .start-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #004d2b;
    }

    .features {
      display: flex;
      justify-content: space-around;
      margin-top: 25px;
      font-size: 14px;
    }

    .feature {
      background: #f0fff7;
      padding: 12px;
      border-radius: 12px;
      color: #008751;
      font-weight: bold;
    }

    /* GAME SCREEN */

    #game-screen,
    #result-screen {
      display: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .game-title {
      font-size: 21px;
      font-weight: 900;
      color: #008751;
    }

    .stats {
      display: flex;
      gap: 8px;
    }

    .stat {
      background: #f0fff7;
      color: #008751;
      padding: 7px 10px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    .progress-container {
      height: 10px;
      background: #e5e5e5;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00a859, #ffd700);
      transition: width 0.4s;
    }

    .question-box {
      background: linear-gradient(135deg, #008751, #006b3c);
      color: white;
      border-radius: 20px;
      padding: 25px 18px;
      text-align: center;
      margin-bottom: 18px;
      box-shadow: 0 8px 20px rgba(0,135,81,0.3);
    }

    .question-number {
      font-size: 14px;
      opacity: 0.85;
    }

    #question {
      font-size: 23px;
      font-weight: 900;
      margin-top: 10px;
      line-height: 1.3;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer {
      width: 100%;
      padding: 16px;
      border: 3px solid #e5e5e5;
      background: white;
      border-radius: 15px;
      font-size: 17px;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    .answer:hover {
      border-color: #008751;
      background: #f0fff7;
      transform: scale(1.02);
    }

    .answer.correct {
      background: #b8f5d5;
      border-color: #008751;
      color: #006b3c;
    }

    .answer.wrong {
      background: #ffd1d1;
      border-color: #e00000;
      color: #a00000;
    }

    .answer:disabled {
      cursor: default;
    }

    #feedback {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      min-height: 30px;
      margin-top: 15px;
    }

    .next-btn {
      display: none;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #ffd700;
      color: #222;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 10px;
    }

    /* RESULT */

    #result-screen {
      text-align: center;
    }

    .trophy {
      font-size: 80px;
      animation: bounce 1.5s infinite;
    }

    .result-title {
      color: #008751;
      font-size: 32px;
      font-weight: 900;
    }

    .final-score {
      font-size: 55px;
      color: #008751;
      font-weight: 900;
      margin: 10px;
    }

    .message {
      font-size: 18px;
      color: #555;
    }

    .coins {
      color: #d69e00;
      font-weight: bold;
      font-size: 20px;
    }

  </style></head><body><div class="game-container">  <div class="card"><!-- START SCREEN -->

<div id="start-screen">

  <div class="logo">🇳🇬</div>

  <div class="title">Naija Brain Battle</div>

  <p class="subtitle">
    How well do you know Nigeria?
  </p>

  <button class="start-btn" onclick="startGame()">
    🎮 START BATTLE
  </button>

  <div class="features">

    <div class="feature">
      🧠 Quiz
    </div>

    <div class="feature">
      🔥 Streak
    </div>

    <div class="feature">
      🪙 Coins
    </div>

  </div>

</div>


<!-- GAME SCREEN -->

<div id="game-screen">

  <div class="top-bar">

    <div class="game-title">
      🇳🇬 Naija Battle
    </div>

    <div class="stats">

      <div class="stat">
        ❤️ <span id="lives">3</span>
      </div>

      <div class="stat">
        🪙 <span id="coins">0</span>
      </div>

      <div class="stat">
        🔥 <span id="streak">0</span>
      </div>

    </div>

  </div>


  <div class="progress-container">

    <div class="progress" id="progress"></div>

  </div>


  <div class="question-box">

    <div class="question-number">
      QUESTION <span id="question-number">1</span>
    </div>

    <div id="question">
      Question goes here
    </div>

  </div>


  <div class="answers" id="answers"></div>

  <div id="feedback"></div>

  <button class="next-btn" id="next-button" onclick="nextQuestion()">
    NEXT QUESTION ➡️
  </button>

</div>


<!-- RESULT SCREEN -->

<div id="result-screen">

  <div class="trophy">
    🏆
  </div>

  <div class="result-title">
    BATTLE COMPLETE!
  </div>

  <p>Your score</p>

  <div class="final-score">
    <span id="final-score">0</span>
  </div>

  <p class="message" id="result-message"></p>

  <p class="coins">
    🪙 Coins earned: <span id="final-coins">0</span>
  </p>

  <button class="start-btn" onclick="startGame()">
    🔄 PLAY AGAIN
  </button>

</div>

  </div></div><script>

const questions = [

  {
    question: "What is the capital of Nigeria?",
    answers: ["Lagos", "Abuja", "Kano", "Benin City"],
    correct: "Abuja"
  },

  {
    question: "How many states are there in Nigeria?",
    answers: ["30", "36", "40", "50"],
    correct: "36"
  },

  {
    question: "What is the currency of Nigeria?",
    answers: ["Dollar", "Cedi", "Naira", "Rand"],
    correct: "Naira"
  },

  {
    question: "Which city is Nigeria's largest city by population?",
    answers: ["Abuja", "Lagos", "Ibadan", "Kano"],
    correct: "Lagos"
  },

  {
    question: "What are the colours of the Nigerian flag?",
    answers: [
      "Green and White",
      "Red and White",
      "Blue and Green",
      "Yellow and Black"
    ],
    correct: "Green and White"
  },

  {
    question: "Which river is one of Nigeria's major rivers?",
    answers: [
      "River Niger",
      "River Nile",
      "River Thames",
      "River Congo"
    ],
    correct: "River Niger"
  },

  {
    question: "What is Nigeria's internet country code?",
    answers: [".ng", ".na", ".ni", ".nig"],
    correct: ".ng"
  },

  {
    question: "Which continent is Nigeria located in?",
    answers: ["Asia", "Africa", "Europe", "South America"],
    correct: "Africa"
  }

];


let currentQuestion = 0;
let score = 0;
let lives = 3;
let streak = 0;
let coins = 0;


function startGame() {

  currentQuestion = 0;
  score = 0;
  lives = 3;
  streak = 0;
  coins = 0;

  document.getElementById("start-screen").style.display = "none";
  document.getElementById("result-screen").style.display = "none";
  document.getElementById("game-screen").style.display = "block";

  updateStats();

  showQuestion();
}


function showQuestion() {

  const data = questions[currentQuestion];

  document.getElementById("question-number").textContent =
    currentQuestion + 1;

  document.getElementById("question").textContent =
    data.question;

  document.getElementById("feedback").textContent = "";

  document.getElementById("next-button").style.display = "none";

  const answers = document.getElementById("answers");

  answers.innerHTML = "";

  data.answers.forEach(answer => {

    const button = document.createElement("button");

    button.textContent = answer;

    button.className = "answer";

    button.onclick = () => checkAnswer(button, answer);

    answers.appendChild(button);

  });


  const progress =
    ((currentQuestion) / questions.length) * 100;

  document.getElementById("progress").style.width =
    progress + "%";
}


function checkAnswer(button, answer) {

  const correct =
    questions[currentQuestion].correct;

  const buttons =
    document.querySelectorAll(".answer");

  buttons.forEach(btn => {
    btn.disabled = true;
  });


  if (answer === correct) {

    button.classList.add("correct");

    score++;

    streak++;

    coins += 10 + (streak * 2);

    document.getElementById("feedback").textContent =
      "🎉 CORRECT! 🔥";

  }

  else {

    button.classList.add("wrong");

    lives--;

    streak = 0;

    coins += 2;

    document.getElementById("feedback").textContent =
      "❌ WRONG! The answer is " + correct;

    buttons.forEach(btn => {

      if (btn.textContent === correct) {
        btn.classList.add("correct");
      }

    });

  }


  updateStats();

  document.getElementById("next-button").style.display =
    "block";


  if (lives <= 0) {

    document.getElementById("feedback").textContent =
      "💥 GAME OVER!";

    document.getElementById("next-button").textContent =
      "SEE RESULTS 🏆";
  }

}


function nextQuestion() {

  if (lives <= 0) {

    finishGame();

    return;
  }


  currentQuestion++;


  if (currentQuestion >= questions.length) {

    finishGame();

  }

  else {

    document.getElementById("next-button").textContent =
      "NEXT QUESTION ➡️";

    showQuestion();

  }

}


function updateStats() {

  document.getElementById("lives").textContent =
    lives;

  document.getElementById("coins").textContent =
    coins;

  document.getElementById("streak").textContent =
    streak;

}


function finishGame() {

  document.getElementById("game-screen").style.display =
    "none";

  document.getElementById("result-screen").style.display =
    "block";


  document.getElementById("final-score").textContent =
    score + " / " + questions.length;

  document.getElementById("final-coins").textContent =
    coins;


  let message;

  if (score === questions.length) {

    message = "🔥 PERFECT! You are a Naija Brain Master!";

  }

  else if (score >= 5) {

    message = "🇳🇬 Excellent! You really know Nigeria!";

  }

  else if (score >= 3) {

    message = "👏 Good job! Keep playing to improve!";

  }

  else {

    message = "💪 Keep practicing. Your next battle can be better!";

  }


  document.getElementById("result-message").textContent =
    message;

}

</script></body>
</html>
