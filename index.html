<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Naija Game Hub</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#031f16;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

button{
    border:0;
    cursor:pointer;
    font-family:inherit;
}

.topbar{
    height:78px;
    background:#063d2b;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    box-shadow:0 3px 12px rgba(0,0,0,.35);
}

.logo{
    font-size:25px;
    font-weight:800;
}

.coins{
    background:#10573e;
    padding:13px 20px;
    border-radius:30px;
    font-size:20px;
}

.page{
    max-width:1100px;
    margin:auto;
    padding:18px 15px 100px;
}

.title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.title{
    font-size:32px;
    font-weight:800;
}

.back{
    background:#155d43;
    color:white;
    padding:15px 25px;
    border-radius:16px;
    font-size:17px;
    font-weight:bold;
}

.scoreboard{
    background:#042c20;
    border-radius:22px;
    padding:16px;
    display:grid;
    grid-template-columns:1fr 150px 1fr;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.team{
    text-align:center;
}

.team-name{
    font-size:19px;
    font-weight:800;
}

.score{
    font-size:45px;
    font-weight:900;
    margin-top:3px;
}

.match-info{
    text-align:center;
}

.timer{
    font-size:28px;
    font-weight:900;
}

.vs{
    font-size:15px;
    margin-top:5px;
    color:#b9d3c9;
}

.pitch-wrapper{
    width:100%;
    background:#105d3d;
    border:4px solid #2b8c59;
    border-radius:22px;
    padding:9px;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}

#footballCanvas{
    display:block;
    width:100%;
    height:auto;
    background:#197a45;
    border-radius:14px;
    touch-action:none;
}

.game-layout{
    display:grid;
    grid-template-columns:270px 1fr;
    gap:20px;
    margin-top:18px;
}

.joystick-area{
    display:flex;
    justify-content:center;
    align-items:center;
}

.joystick{
    width:190px;
    height:190px;
    border-radius:50%;
    background:rgba(26,103,75,.7);
    border:3px solid rgba(255,255,255,.16);
    position:relative;
    touch-action:none;
}

.stick{
    width:82px;
    height:82px;
    border-radius:50%;
    background:#328a65;
    border:3px solid rgba(255,255,255,.15);
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.controls{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.control{
    min-height:70px;
    border-radius:18px;
    color:white;
    font-size:17px;
    font-weight:800;
}

.pass{
    background:#1976e8;
}

.shoot{
    background:#f39a13;
    color:#111;
}

.tackle{
    background:#c62d2d;
}

.sprint{
    background:#168b55;
}

.switch{
    background:#6946bd;
}

.pause{
    background:#444;
}

.status{
    margin-top:15px;
    background:#082e22;
    border-radius:15px;
    padding:14px;
    text-align:center;
    color:#c6ddd5;
    min-height:48px;
}

.cards{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-top:12px;
    color:#ddd;
}

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:75px;
    background:#063b2b;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:50;
    border-top:1px solid rgba(255,255,255,.08);
}

.bottom div{
    text-align:center;
    color:#bdd2ca;
    font-size:14px;
    font-weight:bold;
}

.bottom span{
    display:block;
    font-size:25px;
    margin-bottom:2px;
}

@media(max-width:700px){

    .topbar{
        height:68px;
        padding:0 15px;
    }

    .logo{
        font-size:21px;
    }

    .coins{
        padding:10px 15px;
        font-size:17px;
    }

    .title{
        font-size:27px;
    }

    .back{
        padding:12px 18px;
    }

    .scoreboard{
        grid-template-columns:1fr 90px 1fr;
        padding:12px 8px;
    }

    .team-name{
        font-size:14px;
    }

    .score{
        font-size:37px;
    }

    .timer{
        font-size:23px;
    }

    .game-layout{
        grid-template-columns:1fr;
    }

    .joystick-area{
        order:2;
    }

    .controls{
        order:1;
    }

    .joystick{
        width:150px;
        height:150px;
    }

    .stick{
        width:65px;
        height:65px;
    }

    .control{
        min-height:60px;
        font-size:15px;
    }
}
</style>
</head>

<body>

<div class="topbar">
    <div class="logo">🇳🇬 Naija Game Hub</div>
    <div class="coins">🪙 <span id="coins">1280</span></div>
</div>

<div class="page">

    <div class="title-row">
        <div class="title">⚽ Naija Football</div>
        <button class="back" onclick="location.reload()">Back</button>
    </div>

    <div class="scoreboard">

        <div class="team">
            <div class="team-name" id="homeName">MANCHESTER CITY</div>
            <div class="score" id="homeScore">0</div>
        </div>

        <div class="match-info">
            <div class="timer" id="timer">00:00</div>
            <div class="vs">11 VS 11</div>
        </div>

        <div class="team">
            <div class="team-name" id="awayName">LIVERPOOL</div>
            <div class="score" id="awayScore">0</div>
        </div>

    </div>

    <div class="pitch-wrapper">
        <canvas id="footballCanvas" width="1000" height="620"></canvas>
    </div>

    <div class="game-layout">

        <div class="joystick-area">
            <div class="joystick" id="joystick">
                <div class="stick" id="stick"></div>
            </div>
        </div>

        <div>

            <div class="controls">

                <button class="control pass" onclick="passBall()">
                    🎯 PASS
                </button>

                <button class="control shoot" onclick="shootBall()">
                    🥅 SHOOT
                </button>

                <button class="control tackle" onclick="tackle()">
                    🛡️ TACKLE
                </button>

                <button class="control sprint" onclick="sprint()">
                    ⚡ SPRINT
                </button>

                <button class="control switch" onclick="switchPlayer()">
                    🔄 SWITCH
                </button>

                <button class="control pause" onclick="togglePause()">
                    ⏸️ PAUSE
                </button>

            </div>

            <div class="status" id="status">
                Move your player toward the ball.
            </div>

            <div class="cards">
                <span>🟨 <b id="yellowHome">0</b></span>
                <span>🟥 <b id="redHome">0</b></span>
                <span>🟨 <b id="yellowAway">0</b></span>
                <span>🟥 <b id="redAway">0</b></span>
            </div>

        </div>

    </div>

</div>

<div class="bottom">
    <div>
        <span>🏠</span>
        Home
    </div>

    <div>
        <span>🎮</span>
        Games
    </div>

    <div>
        <span>👤</span>
        Profile
    </div>
</div>


<script>

const canvas = document.getElementById("footballCanvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const pitch = {
    left:35,
    top:25,
    right:965,
    bottom:595
};

const clubs = {
    city:{
        name:"MANCHESTER CITY",
        color:"#74c7e8",
        dark:"#287da3"
    },

    liverpool:{
        name:"LIVERPOOL",
        color:"#e21d35",
        dark:"#8d1020"
    },

    chelsea:{
        name:"CHELSEA",
        color:"#1769c2",
        dark:"#0a3c75"
    },

    arsenal:{
        name:"ARSENAL",
        color:"#df2034",
        dark:"#8b1020"
    }
};

let homeClub = clubs.city;
let awayClub = clubs.liverpool;

let homeScore = 0;
let awayScore = 0;

let matchSeconds = 0;
let running = true;
let paused = false;

let selectedPlayer = 0;

let yellowHome = 0;
let redHome = 0;
let yellowAway = 0;
let redAway = 0;

let joystickX = 0;
let joystickY = 0;

let sprinting = false;

let ball = {
    x:500,
    y:310,
    vx:0,
    vy:0,
    owner:null
};

let players = [];

let referee = {
    x:500,
    y:285,
    vx:0,
    vy:0
};


/* -----------------------------
   PLAYER CREATION
----------------------------- */

function createPlayer(team, number, name, x, y, position, goalkeeper=false){

    return {
        team,
        number,
        name,
        x,
        y,
        homeX:x,
        homeY:y,
        position,
        goalkeeper,

        vx:0,
        vy:0,

        speed: goalkeeper ? 1.7 : 1.9,

        stamina:100,

        yellow:false,
        red:false,

        skin:["#7a4a2a","#9b5a35","#c47a4d","#5d351f"][number % 4]
    };
}


function createTeams(){

    players=[];

    /* MANCHESTER CITY 4-3-3 */

    players.push(
        createPlayer("home",1,"Goalkeeper",80,310,"GK",true),

        createPlayer("home",2,"Right Back",220,105,"RB"),
        createPlayer("home",5,"Centre Back",180,230,"CB"),
        createPlayer("home",4,"Centre Back",180,390,"CB"),
        createPlayer("home",3,"Left Back",220,515,"LB"),

        createPlayer("home",8,"Midfielder",370,150,"CM"),
        createPlayer("home",6,"Midfielder",330,310,"CM"),
        createPlayer("home",10,"Playmaker",370,470,"CM"),

        createPlayer("home",7,"Right Wing",540,125,"RW"),
        createPlayer("home",9,"Striker",570,310,"ST"),
        createPlayer("home",11,"Left Wing",540,495,"LW")
    );


    /* LIVERPOOL 4-3-3 */

    players.push(
        createPlayer("away",1,"Goalkeeper",920,310,"GK",true),

        createPlayer("away",2,"Right Back",780,105,"RB"),
        createPlayer("away",5,"Centre Back",820,230,"CB"),
        createPlayer("away",4,"Centre Back",820,390,"CB"),
        createPlayer("away",3,"Left Back",780,515,"LB"),

        createPlayer("away",8,"Midfielder",630,150,"CM"),
        createPlayer("away",6,"Midfielder",670,310,"CM"),
        createPlayer("away",10,"Playmaker",630,470,"CM"),

        createPlayer("away",7,"Right Wing",460,125,"RW"),
        createPlayer("away",9,"Striker",430,310,"ST"),
        createPlayer("away",11,"Left Wing",460,495,"LW")
    );
}

createTeams();

let controlled = players[9];


/* -----------------------------
   DRAW PITCH
----------------------------- */

function drawPitch(){

    ctx.clearRect(0,0,W,H);

    /* grass */

    ctx.fillStyle="#177642";
    ctx.fillRect(0,0,W,H);

    /* grass stripes */

    for(let i=0;i<10;i++){

        ctx.fillStyle =
            i%2===0
            ? "rgba(255,255,255,.025)"
            : "rgba(0,0,0,.025)";

        ctx.fillRect(
            pitch.left + i*93,
            pitch.top,
            93,
            pitch.bottom-pitch.top
        );
    }

    ctx.strokeStyle="white";
    ctx.lineWidth=5;

    /* outside */

    ctx.strokeRect(
        pitch.left,
        pitch.top,
        pitch.right-pitch.left,
        pitch.bottom-pitch.top
    );

    /* halfway */

    ctx.beginPath();

    ctx.moveTo(500,pitch.top);
    ctx.lineTo(500,pitch.bottom);

    ctx.stroke();

    /* centre circle */

    ctx.beginPath();
    ctx.arc(500,310,82,0,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(500,310,6,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();

    /* penalty areas */

    ctx.strokeRect(35,175,170,270);
    ctx.strokeRect(795,175,170,270);

    /* goal areas */

    ctx.strokeRect(35,245,80,130);
    ctx.strokeRect(885,245,80,130);

    /* penalty spots */

    ctx.beginPath();
    ctx.arc(150,310,5,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(850,310,5,0,Math.PI*2);
    ctx.fill();

    /* goals */

    ctx.strokeStyle="#eeeeee";
    ctx.lineWidth=9;

    ctx.strokeRect(15,250,20,120);
    ctx.strokeRect(965,250,20,120);

    ctx.lineWidth=5;
}


/* -----------------------------
   DRAW PLAYER
----------------------------- */

function drawPlayer(p){

    if(p.red) return;

    let selected =
        p === controlled;

    ctx.save();

    /* shadow */

    ctx.fillStyle="rgba(0,0,0,.28)";
    ctx.beginPath();
    ctx.ellipse(p.x,p.y+18,15,6,0,0,Math.PI*2);
    ctx.fill();

    /* selection ring */

    if(selected){

        ctx.strokeStyle="#ffe600";
        ctx.lineWidth=4;

        ctx.beginPath();
        ctx.arc(p.x,p.y+3,22,0,Math.PI*2);
        ctx.stroke();
    }

    /* legs */

    ctx.strokeStyle="#222";
    ctx.lineWidth=5;

    ctx.beginPath();
    ctx.moveTo(p.x-5,p.y+10);
    ctx.lineTo(p.x-7,p.y+24);
    ctx.moveTo(p.x+5,p.y+10);
    ctx.lineTo(p.x+7,p.y+24);
    ctx.stroke();

    /* boots */

    ctx.fillStyle="#111";

    ctx.beginPath();
    ctx.ellipse(p.x-8,p.y+25,7,3,0,0,Math.PI*2);
    ctx.ellipse(p.x+8,p.y+25,7,3,0,0,Math.PI*2);
    ctx.fill();

    /* shorts */

    ctx.fillStyle=p.team==="home"
        ? homeClub.dark
        : awayClub.dark;

    ctx.fillRect(
        p.x-11,
        p.y+4,
        22,
        12
    );

    /* shirt */

    ctx.fillStyle=p.team==="home"
        ? homeClub.color
        : awayClub.color;

    ctx.beginPath();

    ctx.roundRect(
        p.x-13,
        p.y-13,
        26,
        23,
        5
    );

    ctx.fill();

    /* arms */

    ctx.strokeStyle=p.team==="home"
        ? homeClub.color
        : awayClub.color;

    ctx.lineWidth=6;

    ctx.beginPath();

    ctx.moveTo(p.x-12,p.y-8);
    ctx.lineTo(p.x-19,p.y+5);

    ctx.moveTo(p.x+12,p.y-8);
    ctx.lineTo(p.x+19,p.y+5);

    ctx.stroke();

    /* head */

    ctx.fillStyle=p.skin;

    ctx.beginPath();
    ctx.arc(p.x,p.y-20,10,0,Math.PI*2);
    ctx.fill();

    /* hair */

    ctx.fillStyle="#171717";

    ctx.beginPath();
    ctx.arc(
        p.x,
        p.y-24,
        10,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    /* number */

    ctx.fillStyle="white";
    ctx.font="bold 10px Arial";
    ctx.textAlign="center";
    ctx.fillText(
        p.number,
        p.x,
        p.y+2
    );

    /* goalkeeper gloves */

    if(p.goalkeeper){

        ctx.fillStyle="#ffe600";

        ctx.beginPath();
        ctx.arc(p.x-20,p.y+5,4,0,Math.PI*2);
        ctx.arc(p.x+20,p.y+5,4,0,Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
}


/* -----------------------------
   DRAW REFEREE
----------------------------- */

function drawReferee(){

    ctx.save();

    /* shadow */

    ctx.fillStyle="rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        referee.x,
        referee.y+18,
        14,
        5,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* legs */

    ctx.strokeStyle="#111";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(referee.x-5,referee.y+9);
    ctx.lineTo(referee.x-7,referee.y+23);

    ctx.moveTo(referee.x+5,referee.y+9);
    ctx.lineTo(referee.x+7,referee.y+23);

    ctx.stroke();

    /* body */

    ctx.fillStyle="#111";

    ctx.fillRect(
        referee.x-12,
        referee.y-13,
        24,
        25
    );

    /* head */

    ctx.fillStyle="#a76542";

    ctx.beginPath();

    ctx.arc(
        referee.x,
        referee.y-20,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* whistle */

    ctx.fillStyle="#f4d000";

    ctx.beginPath();

    ctx.arc(
        referee.x+18,
        referee.y-3,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* referee label */

    ctx.fillStyle="white";
    ctx.font="bold 11px Arial";
    ctx.textAlign="center";
    ctx.fillText(
        "REF",
        referee.x,
        referee.y+37
    );

    ctx.restore();
}


/* -----------------------------
   DRAW BALL
----------------------------- */

function drawBall(){

    ctx.save();

    ctx.shadowColor="rgba(0,0,0,.4)";
    ctx.shadowBlur=7;

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#222";
    ctx.lineWidth=2;

    ctx.stroke();

    ctx.restore();
}


/* -----------------------------
   DRAW EVERYTHING
----------------------------- */

function draw(){

    drawPitch();

    players.forEach(drawPlayer);

    drawReferee();

    drawBall();
}


/* -----------------------------
   BALL CONTROL
----------------------------- */

function nearestOpponent(p){

    let closest=null;
    let dist=Infinity;

    players.forEach(o=>{

        if(o.team===p.team || o.red) return;

        let d=Math.hypot(
            o.x-p.x,
            o.y-p.y
        );

        if(d<dist){
            dist=d;
            closest=o;
        }

    });

    return closest;
}


function passBall(){

    if(paused) return;

    if(ball.owner!==controlled){

        setStatus("❌ You don't have the ball.");
        return;
    }

    let teammates=players.filter(
        p=>p.team==="home" &&
        p!==controlled &&
        !p.red
    );

    let target=teammates.reduce(
        (best,p)=>{

            let d=Math.hypot(
                p.x-controlled.x,
                p.y-controlled.y
            );

            return !best || d<best.d
                ? {p,d}
                : best;

        },null
    );

    if(target){

        ball.owner=null;

        let dx=target.p.x-controlled.x;
        let dy=target.p.y-controlled.y;

        let length=Math.hypot(dx,dy)||1;

        ball.x=controlled.x;
        ball.y=controlled.y;

        ball.vx=(dx/length)*7;
        ball.vy=(dy/length)*7;

        setStatus("🎯 Great pass!");
    }
}


function shootBall(){

    if(paused) return;

    if(ball.owner!==controlled){

        setStatus("❌ Get the ball first.");
        return;
    }

    ball.owner=null;

    let goalX=960;

    let dx=goalX-controlled.x;
    let dy=310-controlled.y;

    let length=Math.hypot(dx,dy)||1;

    ball.x=controlled.x;
    ball.y=controlled.y;

    ball.vx=(dx/length)*12;
    ball.vy=(dy/length)*12;

    setStatus("🥅 SHOT!");

    checkShotGoal();
}


function checkShotGoal(){

    setTimeout(()=>{

        if(
            ball.x>960 &&
            ball.y>250 &&
            ball.y<370
        ){

            homeScore++;

            updateScore();

            setStatus(
                "⚽ GOAL! Manchester City scores!"
            );

            resetAfterGoal("home");
        }

    },500);
}


function tackle(){

    if(paused) return;

    let opponent=nearestOpponent(controlled);

    if(!opponent) return;

    let d=Math.hypot(
        opponent.x-controlled.x,
        opponent.y-controlled.y
    );

    if(d<65){

        if(ball.owner===opponent){

            ball.owner=controlled;

            setStatus("🛡️ Excellent tackle! Ball won.");

        }else{

            setStatus("🛡️ Tackle attempted.");

        }

        if(Math.random()<.12){

            yellowHome++;

            updateCards();

            controlled.yellow=true;

            setStatus("🟨 Yellow card!");

        }

    }else{

        setStatus("Move closer to tackle.");

    }
}


function sprint(){

    if(paused) return;

    sprinting=true;

    controlled.stamina=Math.max(
        0,
        controlled.stamina-4
    );

    setStatus("⚡ Sprinting!");

    setTimeout(()=>{
        sprinting=false;
    },900);
}


function switchPlayer(){

    let teammates=players.filter(
        p=>p.team==="home" && !p.red
    );

    selectedPlayer++;

    if(selectedPlayer>=teammates.length){
        selectedPlayer=0;
    }

    controlled=teammates[selectedPlayer];

    setStatus(
        "🔄 " +
        controlled.name +
        " #" +
        controlled.number +
        " selected."
    );
}


/* -----------------------------
   PLAYER MOVEMENT
----------------------------- */

function moveControlled(){

    let speed=sprinting
        ? 4.5
        : 2.6;

    controlled.x+=joystickX*speed;
    controlled.y+=joystickY*speed;

    controlled.x=Math.max(
        pitch.left+15,
        Math.min(pitch.right-15,controlled.x)
    );

    controlled.y=Math.max(
        pitch.top+25,
        Math.min(pitch.bottom-25,controlled.y)
    );

    if(ball.owner===controlled){

        ball.x=controlled.x+18;
        ball.y=controlled.y;
    }
}


/* -----------------------------
   AI
----------------------------- */

function updateAI(){

    players.forEach(p=>{

        if(
            p===controlled ||
            p.red
        ) return;

        let targetX=p.homeX;
        let targetY=p.homeY;

        if(ball.owner===p){

            if(p.team==="away"){

                targetX=50;

                targetY=310;

            }

        }else{

            let distance=Math.hypot(
                ball.x-p.x,
                ball.y-p.y
            );

            if(distance<170){

                targetX=ball.x;
                targetY=ball.y;

            }
        }

        let dx=targetX-p.x;
        let dy=targetY-p.y;

        let d=Math.hypot(dx,dy)||1;

        p.x+=(dx/d)*p.speed;
        p.y+=(dy/d)*p.speed;

        p.x=Math.max(
            pitch.left+15,
            Math.min(pitch.right-15,p.x)
        );

        p.y=Math.max(
            pitch.top+20,
            Math.min(pitch.bottom-20,p.y)
        );

        /* AI shooting */

        if(
            p.team==="away" &&
            ball.owner===p &&
            p.x<300
        ){

            ball.owner=null;

            let dx=40-p.x;
            let dy=310-p.y;

            let d=Math.hypot(dx,dy)||1;

            ball.x=p.x;
            ball.y=p.y;

            ball.vx=(dx/d)*7;
            ball.vy=(dy/d)*7;
        }

    });
}


/* -----------------------------
   BALL PHYSICS
----------------------------- */

function updateBall(){

    if(ball.owner){

        ball.x=ball.owner.x;
        ball.y=ball.owner.y;

        return;
    }

    ball.x+=ball.vx;
    ball.y+=ball.vy;

    ball.vx*=.97;
    ball.vy*=.97;

    /* side bounce */

    if(
        ball.y<pitch.top ||
        ball.y>pitch.bottom
    ){

        ball.vy*=-.75;
    }

    /* possession */

    players.forEach(p=>{

        if(p.red) return;

        let d=Math.hypot(
            ball.x-p.x,
            ball.y-p.y
        );

        if(d<25){

            ball.owner=p;

            ball.vx=0;
            ball.vy=0;
        }

    });

    /* away goal */

    if(
        ball.x>980 &&
        ball.y>250 &&
        ball.y<370
    ){

        homeScore++;

        updateScore();

        setStatus(
            "⚽ GOAL! Manchester City!"
        );

        resetAfterGoal("home");
    }

    /* home goal */

    if(
        ball.x<20 &&
        ball.y>250 &&
        ball.y<370
    ){

        awayScore++;

        updateScore();

        setStatus(
            "⚽ GOAL! Liverpool!"
        );

        resetAfterGoal("away");
    }

    /* reset ball if it leaves field */

    if(
        ball.x<-50 ||
        ball.x>1050
    ){

        ball.x=500;
        ball.y=310;
        ball.vx=0;
        ball.vy=0;
    }
}


/* -----------------------------
   GOAL RESET
----------------------------- */

function resetAfterGoal(team){

    ball.x=500;
    ball.y=310;

    ball.vx=0;
    ball.vy=0;

    ball.owner=null;

    players.forEach(p=>{

        p.x=p.homeX;
        p.y=p.homeY;

    });

    controlled=players.find(
        p=>p.team==="home" &&
        p.number===9
    );

    setTimeout(()=>{
        setStatus(
            "⚽ Match continues..."
        );
    },1800);
}


/* -----------------------------
   REFEREE AI
----------------------------- */

function updateReferee(){

    let targetX=ball.x+35;
    let targetY=ball.y-35;

    let dx=targetX-referee.x;
    let dy=targetY-referee.y;

    let d=Math.hypot(dx,dy)||1;

    referee.x+=(dx/d)*1.15;
    referee.y+=(dy/d)*1.15;

    referee.x=Math.max(
        100,
        Math.min(900,referee.x)
    );

    referee.y=Math.max(
        70,
        Math.min(550,referee.y)
    );
}


/* -----------------------------
   MATCH LOOP
----------------------------- */

let lastTime=performance.now();

function gameLoop(now){

    let dt=(now-lastTime)/1000;

    lastTime=now;

    if(
        running &&
        !paused
    ){

        matchSeconds+=dt;

        if(matchSeconds>=90){

            matchSeconds=90;

            running=false;

            setStatus(
                "🏁 FULL TIME — " +
                homeScore +
                " : " +
                awayScore
            );
        }

        moveControlled();
        updateAI();
        updateBall();
        updateReferee();

        document.getElementById("timer").textContent =
            formatTime(matchSeconds);
    }

    draw();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);


/* -----------------------------
   TIME
----------------------------- */

function formatTime(seconds){

    let s=Math.floor(seconds);

    let minutes=Math.floor(s/60);

    let secs=s%60;

    return String(minutes).padStart(2,"0")
        +":"+
        String(secs).padStart(2,"0");
}

   UI

    document.getElementById(

/* -----------------------------
   JOYSTICK
----------------------------- */

const joystick=
    document.getElementById("joystick");

const stick=
    document.getElementById("stick");

let joystickActive=false;

function updateJoystick(e){

    let rect=joystick.getBoundingClientRect();

    let centerX=rect.left+rect.width/2;
    let centerY=rect.top+rect.height/2;

    let dx=e.clientX-centerX;
    let dy=e.clientY-centerY;

    let max=rect.width/2-35;

    let distance=Math.hypot(dx,dy);

    if(distance>max){

        dx=(dx/distance)*max;
        dy=(dy/distance)*max;
    }

    joystickX=dx/max;
    joystickY=dy/max;

    stick.style.transform=
        `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}


joystick.addEventListener(
    "pointerdown",
    e=>{

        joystickActive=true;

        joystick.setPointerCapture(e.pointerId);

        updateJoystick(e);
    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(joystickActive){
            updateJoystick(e);
        }

    }
);


joystick.addEventListener(
    "pointerup",
    resetJoystick
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


function resetJoystick(){

    joystickActive=false;

    joystickX=0;
    joystickY=0;

    stick.style.transform=
        "translate(-50%,-50%)";
}


/* -----------------------------
   KEYBOARD SUPPORT
----------------------------- */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="ArrowUp" || e.key==="w")
            joystickY=-1;

        if(e.key==="ArrowDown" || e.key==="s")
            joystickY=1;

        if(e.key==="ArrowLeft" || e.key==="a")
            joystickX=-1;

        if(e.key==="ArrowRight" || e.key==="d")
            joystickX=1;

        if(e.key===" ")
            shootBall();

    }
);


document.addEventListener(
    "keyup",
    e=>{

        if(
            ["ArrowUp","ArrowDown","w","s"]
            .includes(e.key)
        )
            joystickY=0;

        if(
            ["ArrowLeft","ArrowRight","a","d"]
            .includes(e.key)
        )
            joystickX=0;

    }
);

</script>
