<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naija Game Hub - Ludo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#071b12;
  color:white;
  min-height:100vh;
}

button{
  border:0;
  cursor:pointer;
}

.top{
  background:linear-gradient(135deg,#008751,#00a862);
  padding:18px;
  text-align:center;
  font-weight:bold;
  font-size:22px;
  position:sticky;
  top:0;
  z-index:10;
}

.back{
  position:absolute;
  left:12px;
  top:15px;
  background:#ffffff22;
  color:white;
  padding:9px 12px;
  border-radius:10px;
}

.container{
  max-width:600px;
  margin:auto;
  padding:15px;
}

.card{
  background:#10291e;
  border-radius:20px;
  padding:15px;
  box-shadow:0 8px 25px #0006;
}

.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  gap:8px;
}

.badge{
  padding:9px 12px;
  border-radius:12px;
  font-weight:bold;
  font-size:13px;
}

.green{
  background:#21c46b;
  color:#062612;
}

.red{
  background:#e84b4b;
}

.yellow{
  background:#f6c945;
  color:#382900;
}

.blue{
  background:#3789ff;
}

#turnText{
  text-align:center;
  font-weight:bold;
  margin:10px 0;
}

/* BOARD */

.board{
  width:100%;
  aspect-ratio:1;
  background:#f4f1df;
  border:5px solid #1d241f;
  border-radius:8px;
  display:grid;
  grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);
  overflow:hidden;
  position:relative;
}

.cell{
  border:1px solid #aaa8a0;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* HOME AREAS */

.home-green{
  grid-column:1/7;
  grid-row:1/7;
  background:#19b963;
  position:relative;
}

.home-yellow{
  grid-column:10/16;
  grid-row:1/7;
  background:#f5ca3b;
  position:relative;
}

.home-red{
  grid-column:10/16;
  grid-row:10/16;
  background:#e84949;
  position:relative;
}

.home-blue{
  grid-column:1/7;
  grid-row:10/16;
  background:#3788ef;
  position:relative;
}

.home-inner{
  position:absolute;
  left:14%;
  top:14%;
  width:72%;
  height:72%;
  background:white;
  border-radius:15px;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:10px;
  padding:12px;
}

.token-home{
  border-radius:50%;
  border:3px solid #222;
  box-shadow:inset 0 3px 5px #0004,0 2px 4px #0005;
}

.token-home.green{background:#18b963;}
.token-home.yellow{background:#f4c735;}
.token-home.red{background:#e74444;}
.token-home.blue{background:#3789ef;}

/* PATH */

.path{
  background:#fffdf2;
}

.path.green-path{
  background:#a7e8c5;
}

.path.yellow-path{
  background:#f9e8a1;
}

.path.red-path{
  background:#f5b2b2;
}

.path.blue-path{
  background:#a9cafa;
}

.safe{
  background:#fff !important;
}

.safe:after{
  content:"★";
  color:#555;
  font-size:11px;
}

/* CENTER */

.center{
  grid-column:7/10;
  grid-row:7/10;
  background:conic-gradient(
    #21c46b 0deg 90deg,
    #f5ca3b 90deg 180deg,
    #e84949 180deg 270deg,
    #3789ef 270deg 360deg
  );
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.center:after{
  content:"🏆";
  background:white;
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  box-shadow:0 2px 7px #0005;
}

/* TOKEN ON BOARD */

.token{
  width:72%;
  height:72%;
  border-radius:50%;
  border:2px solid #222;
  box-shadow:0 3px 5px #0007;
  z-index:5;
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:bold;
}

.token.green{background:#18b963;}
.token.yellow{background:#f4c735;}
.token.red{background:#e74444;}
.token.blue{background:#3789ef;}

.movable{
  animation:pulse .7s infinite alternate;
  box-shadow:0 0 0 4px white,0 0 15px #fff;
}

@keyframes pulse{
  from{transform:scale(1);}
  to{transform:scale(1.18);}
}

/* DICE */

.controls{
  margin-top:16px;
  text-align:center;
}

.dice{
  width:70px;
  height:70px;
  background:white;
  color:#111;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  margin:0 auto 12px;
  box-shadow:0 5px 12px #0006;
}

.roll{
  width:100%;
  padding:16px;
  border-radius:14px;
  background:linear-gradient(135deg,#f6c945,#ffdb63);
  color:#382900;
  font-size:17px;
  font-weight:bold;
}

.roll:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.message{
  text-align:center;
  min-height:24px;
  margin-top:12px;
  font-size:14px;
}

.newgame{
  width:100%;
  padding:13px;
  margin-top:10px;
  background:#ffffff16;
  color:white;
  border-radius:12px;
}

.legend{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
  font-size:12px;
}

.legend div{
  background:#ffffff0d;
  padding:8px;
  border-radius:9px;
}
</style>
</head>

<body>

<div class="top">
  <button class="back" onclick="goBack()">← Back</button>
  🎲 Naija Ludo
</div>

<div class="container">

  <div class="card">

    <div class="status">
      <div class="badge green">🟢 YOU</div>
      <div class="badge red">🔴 COMPUTER</div>
    </div>

    <div id="turnText">Your turn</div>

    <div class="board" id="board">

      <!-- HOMES -->

      <div class="home-green">
        <div class="home-inner">
          <div class="token-home green"></div>
          <div class="token-home green"></div>
          <div class="token-home green"></div>
          <div class="token-home green"></div>
        </div>
      </div>

      <div class="home-yellow">
        <div class="home-inner">
          <div class="token-home yellow"></div>
          <div class="token-home yellow"></div>
          <div class="token-home yellow"></div>
          <div class="token-home yellow"></div>
        </div>
      </div>

      <div class="home-red">
        <div class="home-inner">
          <div class="token-home red"></div>
          <div class="token-home red"></div>
          <div class="token-home red"></div>
          <div class="token-home red"></div>
        </div>
      </div>

      <div class="home-blue">
        <div class="home-inner">
          <div class="token-home blue"></div>
          <div class="token-home blue"></div>
          <div class="token-home blue"></div>
          <div class="token-home blue"></div>
        </div>
      </div>

      <div class="center"></div>

    </div>

    <div class="controls">

      <div class="dice" id="dice">🎲</div>

      <button class="roll" id="rollBtn" onclick="rollDice()">
        🎲 ROLL DICE
      </button>

      <div class="message" id="message">
        Roll a 6 to bring a token out!
      </div>

      <button class="newgame" onclick="newGame()">
        🔄 NEW GAME
      </button>

    </div>

    <div class="legend">
      <div>🟢 Your tokens</div>
      <div>🔴 Computer tokens</div>
      <div>⭐ Safe squares</div>
      <div>🎲 Roll 6 to enter</div>
    </div>

  </div>

</div>

<script>

/* =========================
   LUDO GAME
========================= */

const board = document.getElementById("board");
const diceEl = document.getElementById("dice");
const rollBtn = document.getElementById("rollBtn");
const message = document.getElementById("message");
const turnText = document.getElementById("turnText");

/*
  52-space classic outer path.
  Coordinates are row,column.
*/

const path = [
  [6,1],[6,2],[6,3],[6,4],[6,5],
  [5,6],[4,6],[3,6],[2,6],[1,6],
  [1,7],[1,8],
  [2,8],[3,8],[4,8],[5,8],
  [6,9],[6,10],[6,11],[6,12],[6,13],
  [7,13],[8,13],
  [8,12],[8,11],[8,10],[8,9],
  [9,8],[10,8],[11,8],[12,8],[13,8],
  [13,7],[13,6],
  [12,6],[11,6],[10,6],[9,6],
  [8,5],[8,4],[8,3],[8,2],[8,1],
  [7,1]
];

/*
  Add some additional path cells to complete
  a visually continuous Ludo route.
*/

const extraPath = [
  [1,8],[2,8],[3,8],[4,8],[5,8],
  [8,6],[8,7],[8,8],
  [6,6],[6,7],[6,8]
];

/* Safe spaces */

const safeSpaces = [0,8,13,21,26,34,39,47];

/*
  Player tokens:
  -1 = home
   0-51 = path
  52 = finished
*/

let player = [-1,-1,-1,-1];
let computer = [-1,-1,-1,-1];

let turn = "player";
let currentRoll = 0;
let gameOver = false;

/* starting positions */

const PLAYER_START = 0;
const COMPUTER_START = 26;

/* Dice faces */

const diceFaces = ["⚀","⚁","⚂","⚃","⚄","⚅"];


/* =========================
   CREATE PATH
========================= */

function createBoard(){

  /*
    Create path cells.
  */

  path.forEach((pos,index)=>{

    const cell = document.createElement("div");

    cell.className = "cell path";

    cell.style.gridRow = pos[0];
    cell.style.gridColumn = pos[1];

    if(safeSpaces.includes(index)){
      cell.classList.add("safe");
    }

    /*
      Color sections.
    */

    if(index >= 0 && index <= 12){
      cell.classList.add("green-path");
    }

    if(index >= 13 && index <= 25){
      cell.classList.add("yellow-path");
    }

    if(index >= 26 && index <= 38){
      cell.classList.add("red-path");
    }

    if(index >= 39){
      cell.classList.add("blue-path");
    }

    board.appendChild(cell);

  });

}

createBoard();


/* =========================
   TOKEN POSITION
========================= */

function getCell(index){

  if(index < 0 || index >= path.length){
    return null;
  }

  const p = path[index];

  const cells = board.querySelectorAll(".path");

  for(let cell of cells){

    if(
      Number(cell.style.gridRow) === p[0] &&
      Number(cell.style.gridColumn) === p[1]
    ){
      return cell;
    }

  }

  return null;
}


/* =========================
   DRAW TOKENS
========================= */

function drawTokens(){

  document.querySelectorAll(".game-token").forEach(x=>x.remove());

  drawPlayerTokens();
  drawComputerTokens();

}


function makeToken(color,index){

  const token = document.createElement("div");

  token.className = "token " + color + " game-token";

  token.innerText = index + 1;

  return token;

}


function drawPlayerTokens(){

  player.forEach((position,index)=>{

    if(position < 0 || position >= 52){
      return;
    }

    const cell = getCell(position);

    if(!cell)return;

    const token = makeToken("green",index);

    if(turn==="player" && currentRoll>0 && canMovePlayer(index)){
      token.classList.add("movable");

      token.onclick = ()=>{
        movePlayer(index);
      };
    }

    cell.appendChild(token);

  });

}


function drawComputerTokens(){

  computer.forEach((position,index)=>{

    if(position < 0 || position >= 52){
      return;
    }

    const cell = getCell(position);

    if(!cell)return;

    const token = makeToken("red",index);

    cell.appendChild(token);

  });

}


/* =========================
   MOVE RULES
========================= */

function playerAbsolute(position){

  if(position === -1){
    return -1;
  }

  return (PLAYER_START + position) % 52;

}


function computerAbsolute(position){

  if(position === -1){
    return -1;
  }

  return (COMPUTER_START + position) % 52;

}


function canMovePlayer(index){

  const pos = player[index];

  if(pos === 52)return false;

  if(pos === -1){
    return currentRoll === 6;
  }

  return pos + currentRoll <= 52;

}


function canMoveComputer(index){

  const pos = computer[index];

  if(pos === 52)return false;

  if(pos === -1){
    return currentRoll === 6;
  }

  return pos + currentRoll <= 52;

}


/* =========================
   PLAYER ROLL
========================= */

function rollDice(){

  if(turn !== "player" || gameOver){
    return;
  }

  rollBtn.disabled = true;

  currentRoll = Math.floor(Math.random()*6)+1;

  diceEl.innerText = diceFaces[currentRoll-1];

  message.innerText = "You rolled " + currentRoll;

  const movable = player
    .map((_,i)=>canMovePlayer(i))
    .filter(Boolean);

  if(movable.length === 0){

    message.innerText =
      "No token can move.";

    setTimeout(()=>{

      if(currentRoll===6){

        turnText.innerText="Your turn again!";
        rollBtn.disabled=false;

      }else{

        computerTurn();

      }

    },900);

    return;
  }

  message.innerText =
    "Choose a glowing token.";

  drawTokens();

}


/* =========================
   PLAYER MOVE
========================= */

function movePlayer(index){

  if(turn!=="player"){
    return;
  }

  if(!canMovePlayer(index)){
    return;
  }

  if(player[index] === -1){

    player[index] = 0;

  }else{

    player[index] += currentRoll;

  }

  capturePlayer(index);

  drawTokens();

  if(checkPlayerWin()){
    finishGame(true);
    return;
  }

  const six = currentRoll === 6;

  currentRoll = 0;

  if(six){

    message.innerText =
      "🎉 You rolled 6! Roll again.";

    rollBtn.disabled=false;

  }else{

    computerTurn();

  }

}


/* =========================
   CAPTURE
========================= */

function capturePlayer(index){

  const playerPos = playerAbsolute(player[index]);

  if(playerPos < 0)return;

  if(safeSpaces.includes(playerPos)){
    return;
  }

  computer.forEach((pos,i)=>{

    if(pos < 0 || pos >= 52){
      return;
    }

    const computerPos = computerAbsolute(pos);

    if(playerPos === computerPos){

      computer[i] = -1;

      message.innerText =
        "💥 You captured a computer token!";

    }

  });

}


/* =========================
   COMPUTER TURN
========================= */

function computerTurn(){

  if(gameOver)return;

  turn="computer";

  turnText.innerText="🔴 Computer's turn";
  rollBtn.disabled=true;

  setTimeout(()=>{

    currentRoll =
      Math.floor(Math.random()*6)+1;

    diceEl.innerText =
      diceFaces[currentRoll-1];

    message.innerText =
      "Computer rolled " + currentRoll;

    const movable = computer
      .map((_,i)=>canMoveComputer(i))
      .filter(Boolean);

    if(movable.length===0){

      setTimeout(()=>{

        if(currentRoll===6){

          turn="player";
          turnText.innerText="🟢 Your turn";
          rollBtn.disabled=false;

        }else{

          startPlayerTurn();

        }

      },900);

      return;
    }

    /*
      Computer chooses a token.

      Priority:
      1. capture
      2. move forward
      3. bring token out
    */

    let choices =
      computer
        .map((_,i)=>i)
        .filter(i=>canMoveComputer(i));

    let chosen =
      choices[Math.floor(Math.random()*choices.length)];

    if(currentRoll===6){

      const home =
        choices.find(i=>computer[i]===-1);

      if(home !== undefined){
        chosen=home;
      }

    }

    setTimeout(()=>{

      if(computer[chosen]===-1){

        computer[chosen]=0;

      }else{

        computer[chosen]+=currentRoll;

      }

      captureComputer(chosen);

      drawTokens();

      if(checkComputerWin()){

        finishGame(false);
        return;

      }

      const six=currentRoll===6;

      currentRoll=0;

      if(six){

        setTimeout(()=>computerTurn(),700);

      }else{

        startPlayerTurn();

      }

    },900);

  },700);

}


/* =========================
   COMPUTER CAPTURE
========================= */

function captureComputer(index){

  const computerPos =
    computerAbsolute(computer[index]);

  if(computerPos < 0)return;

  if(safeSpaces.includes(computerPos)){
    return;
  }

  player.forEach((pos,i)=>{

    if(pos<0 || pos>=52){
      return;
    }

    const playerPos =
      playerAbsolute(pos);

    if(playerPos===computerPos){

      player[i]=-1;

      message.innerText =
        "😱 Computer captured your token!";

    }

  });

}


/* =========================
   PLAYER TURN
========================= */

function startPlayerTurn(){

  turn="player";

  turnText.innerText="🟢 Your turn";

  message.innerText =
    "Roll the dice!";

  rollBtn.disabled=false;

  drawTokens();

}


/* =========================
   WIN
========================= */

function checkPlayerWin(){

  return player.every(x=>x===52);

}


function checkComputerWin(){

  return computer.every(x=>x===52);

}


function finishGame(playerWon){

  gameOver=true;

  rollBtn.disabled=true;

  if(playerWon){

    turnText.innerText="🏆 YOU WIN!";

    message.innerText =
      "🎉 Congratulations! You defeated the computer! +100 coins";

  }else{

    turnText.innerText="😔 COMPUTER WINS";

    message.innerText =
      "The computer reached home first. Try again!";

  }

}


/* =========================
   NEW GAME
========================= */

function newGame(){

  player=[-1,-1,-1,-1];

  computer=[-1,-1,-1,-1];

  turn="player";

  currentRoll=0;

  gameOver=false;

  diceEl.innerText="🎲";

  turnText.innerText="🟢 Your turn";

  message.innerText=
    "Roll a 6 to bring a token out!";

  rollBtn.disabled=false;

  drawTokens();

}


/* =========================
   BACK
========================= */

function goBack(){

  /*
    If this is being used inside
    your existing Game Hub,
    change this to your home function.

    For now it goes back in browser.
  */

  history.back();

}


/* START */

newGame();

</script>

</body>
</html>
